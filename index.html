  <script>
    // Cada entrada usa una dirección nueva (agrega t=hora) para que el navegador no muestre una copia vieja de la página.
    if (!/[?&]t=/.test(location.search)) {
      location.replace(location.pathname + location.search + (location.search ? "&" : "?") + "t=" + Date.now() + location.hash);
    }
  </script>
  <script>
    // Si algo falla al cargar, lo muestra en la página para poder verlo y avisar qué pasó.
    window.addEventListener("error", function (e) {
      var a = document.getElementById("app");
      if (!a || a.children.length) return;
      var que = e.target && e.target !== window ? "No se pudo cargar " + (e.target.src || e.target.href) : e.message + " (" + String(e.filename || "").split("/").pop() + ", línea " + e.lineno + ")";
      a.textContent = "No se pudo mostrar la encuesta. Recargá la página. Detalle: " + que;
    }, true);
  </script>
  <meta name="theme-color" content="#24639a">
